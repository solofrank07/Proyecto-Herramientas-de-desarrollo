<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta — Sabor IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body data-page="register" class="auth-page">

<div class="auth-card">
  <a href="Index.html" class="auth-logo">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 10h1.5a3.5 3.5 0 0 1 0 7H21"/>
      <path d="M3 10h18v8a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V10z"/>
      <line x1="8" y1="2" x2="8" y2="5"/>
      <line x1="13" y1="2" x2="13" y2="5"/>
      <line x1="18" y1="2" x2="18" y2="5"/>
    </svg>
    Sabor IA
  </a>

  <h1 class="auth-title">Crear Cuenta</h1>
  <p class="auth-subtitle">Únete y descubre recetas increíbles</p>

  <div class="auth-error" id="registerError"></div>

  <form class="auth-form" id="registerForm">
    <div class="form-group">
      <label for="regNombre">Nombre completo</label>
      <input class="input" id="regNombre" type="text" placeholder="Ej: Juan Pérez" required>
    </div>
    <div class="form-group">
      <label for="regCorreo">Correo electrónico</label>
      <input class="input" id="regCorreo" type="email" placeholder="tu@correo.com" required>
    </div>
    <div class="form-group">
      <label for="regPass">Contraseña</label>
      <input class="input" id="regPass" type="password" placeholder="Mínimo 5 caracteres" required minlength="5">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:14px">Crear cuenta</button>
  </form>

  <p class="auth-footer">
    ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
  </p>
</div>

<script src="js/main.js"></script>
</body>
</html>
